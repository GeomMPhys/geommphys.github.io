<footer class="site-footer">
  <div class="container site-footer__inner">
    <div class="site-footer__id">
      <span class="mark mark--footer" aria-hidden="true"></span>
      <div>
      <strong>{{ site.data.site.group_name }}</strong>
      <p>{{ site.data.site.tagline }}. Contact us at <a href="mailto:{{ site.data.site.email }}">{{ site.data.site.email }}</a></p>
      </div>
    </div>
    <div class="site-footer__links">
      {% for link in site.data.site.links %}
        <a href="{{ link.url }}">{{ link.label }}</a>
      {% endfor %}
    </div>
  </div>
</footer>
