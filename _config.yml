title: Geometry and Mathematical Physics
description: Research group website for geometry, mathematical physics, string theory, and related areas.
url: ""
baseurl: ""
timezone: Europe/Madrid
lang: en

markdown: kramdown
kramdown:
  input: GFM

permalink: pretty

defaults:
  - scope:
      path: ""
    values:
      layout: page
      # Social preview card for jekyll-seo-tag (og:image / twitter:image).
      # Regenerate from assets/images/marks/og-art.svg; see DEVELOPING.md.
      image: /assets/images/marks/og-card.png

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed

exclude:
  - AGENTS.md
  - assets/fonts/README.md
  - DEVELOPING.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - private/
  - internal/
  - migration-notes/
  - google-sites-export/
  - node_modules/
  - .bundle/
  - vendor/
  - .agents/
  - .codex/
