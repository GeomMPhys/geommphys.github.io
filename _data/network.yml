# ───────────────────────────────────────────────────────────────────
#  INTERNATIONAL NETWORK MAP  →  the map on the "People" and home pages
# ───────────────────────────────────────────────────────────────────
#  HOW TO EDIT
#  • To update a place, edit its "label", "subtitle", or "members".
#    Those three are safe to change at any time — the page picks them up
#    on the next build, with nothing else to do.
#  • "members" is a list of person ids from people.yml (the same ids used
#    everywhere else). Hover or tab a point on the map to see the place,
#    its institution (subtitle) and its members' names, resolved from
#    people.yml. For someone not in people.yml, write
#      - { name: "Full Name" }   instead.
#  • "lat" and "lon" are the real latitude and longitude of the place, in
#    degrees: north and east are positive, south and west negative. Look
#    them up once (Wikipedia gives them for any university) and write them
#    to two decimals. They are NOT pixel positions — the map works out
#    where the point goes.
#
#  ADDING, REMOVING OR MOVING A PLACE needs one extra step, because the
#  coastlines and the point positions are drawn ahead of time:
#
#      bin/bake-map.mjs            (see the comment at the top of that file)
#
#  That rewrites _data/network_geometry.yml, which is generated — never
#  edit it by hand. `ruby bin/validate_data.rb` fails if a place here has
#  no geometry, so a forgotten bake is caught before it is deployed.
#
#  FIELDS (per location)
#    id        (required)  short name, lowercase-with-hyphens; the key that
#                          ties this place to its baked position
#    label     (required)  place name, in quotes
#    subtitle  (required)  institution, in quotes
#    lat, lon  (required)  latitude and longitude in degrees (numbers)
#    members   (required)  list of person ids from people.yml
# ───────────────────────────────────────────────────────────────────

