# ───────────────────────────────────────────────────────────────────
#  ORGANIZATION  →  responsibilities shown on the Organization page
# ───────────────────────────────────────────────────────────────────
#  HOW TO EDIT
#  • Each role is one responsibility box. Add or remove a person's entry
#    under members to update who is responsible. Use subroles for grouped
#    responsibilities inside one box.
#  • Use a stable person id from people.yml, not a person's name.
#  • Add `since` when the start date or period is known and useful.
#
#  FIELDS
#    role     (required)  responsibility or role title
#    members  (optional)  list of { person, since? } entries
#    subroles (optional)  list of { role, members } subdivisions
#    person   (required)  person id from people.yml
#    since    (optional)  when this responsibility began
# ───────────────────────────────────────────────────────────────────

