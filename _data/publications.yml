# ───────────────────────────────────────────────────────────────────
#  PUBLICATIONS  →  shown on the "Publications" page
# ───────────────────────────────────────────────────────────────────
#  HOW TO EDIT
#  • Add a paper by copying a "- title:" block under "selected:".
#  • List newest first. The page groups papers by "year" automatically.
#  • 2 spaces before "-". Quote titles and venues.
#
#  FIELDS
#    title    (required)  paper title, in quotes
#    venue    (required)  journal / "Preprint" / conference, in quotes
#    year     (required)  four digits, no quotes
#    arxiv    (optional)  arXiv id only, e.g. "2601.00000" ("" if none)
#    doi      (optional)  DOI only, e.g. "10.1000/xyz" ("" if none)
#    authors  (required)  a list, in the paper's own order; each item is
#                 EITHER a person id from people.yml (group members), so
#                 that their name links to their entry, e.g.
#                     - manuel-lainz
#                 OR, for co-authors NOT in people.yml, a name like:
#                     - { name: "Jane Doe" }
#                 Write ids in the order the paper lists its authors —
#                 the page prints them in exactly that order. A member's
#                 name is always printed as it is written in people.yml,
#                 so it reads the same on every paper. This is the same
#                 shape workshops.yml uses for "organizers".
# ───────────────────────────────────────────────────────────────────

