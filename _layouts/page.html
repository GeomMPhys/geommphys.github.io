---
layout: default
---

<section class="page-heading">
  <div class="container">
    <h1>{{ page.title }}</h1>
    {% if page.description %}
      <p class="lead">{{ page.description }}</p>
    {% endif %}
  </div>
</section>

<section class="page-content">
  <div class="container page-content__inner">
    {{ content }}
  </div>
</section>
